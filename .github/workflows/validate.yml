name: Validate NoteLive Studio JavaScript

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript and CommonJS syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          while IFS= read -r file; do node --check "$file"; done < <(find public desktop -type f \( -name '*.js' -o -name '*.cjs' \) -print)
