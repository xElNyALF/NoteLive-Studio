name: Build and publish NoteLive Studio for Windows

on:
  push:
    branches:
      - main
      - music-visualizer-update
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create or reuse a single GitHub Release for this version
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ("$env:GITHUB_REF" -like "refs/tags/v*") {
            $tag = "$env:GITHUB_REF_NAME"
          } else {
            $tag = "v$($pkg.version)"
          }
          $installerAsset = "NoteLive-Studio-Setup-$($pkg.version).exe"
          $assets = gh release view $tag --json assets --jq ".assets[].name" 2>$null
          $viewExit = $LASTEXITCODE
          if ($viewExit -eq 0 -and ($assets -contains $installerAsset)) {
            "should_publish=false" >> $env:GITHUB_OUTPUT
            Write-Host "The installer already exists in release $tag; skipping duplicate publication."
          } else {
            if ($viewExit -ne 0) {
              gh release create $tag --target "$env:GITHUB_SHA" --title "NoteLive Studio $($pkg.version)" --notes "NoteLive Studio $($pkg.version) for Windows. Installer built by GitHub Actions."
              if ($LASTEXITCODE -ne 0) { throw "Could not create GitHub Release $tag" }
            } else {
              Write-Host "Release $tag exists but the installer is missing. It will be built and uploaded now."
            }
            "should_publish=true" >> $env:GITHUB_OUTPUT
          }

      - name: Install dependencies
        if: steps.release.outputs.should_publish == 'true'
        run: npm install --no-audit --no-fund

      - name: Build installer and publish GitHub Release
        if: steps.release.outputs.should_publish == 'true'
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
