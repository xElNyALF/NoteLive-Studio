<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>NoteLive · Twitch Follow Alert</title>
  <link rel="stylesheet" href="/twitch-overlay.css">
</head>
<body>
  <main class="alert-stage">
    <article id="follow-alert" class="follow-alert" data-style="card" aria-live="polite" hidden>
      <div class="alert-glow"></div>
      <div class="alert-icon-wrap"><span class="alert-icon" id="alert-icon" aria-hidden="true">♥</span><img id="alert-image" class="alert-custom-image" alt="" hidden></div>
      <div class="alert-copy">
        <div class="alert-eyebrow">TWITCH COMMUNITY</div>
        <h1 id="alert-title">¡Nuevo follow!</h1>
        <p id="alert-message">Alguien nuevo se unió a la comunidad</p>
      </div>
      <div class="alert-spark" aria-hidden="true">✦</div>
    </article>
  </main>
  <script src="/twitch-overlay.js" defer></script>
</body>
</html>
